<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create an account - App Veille</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .create-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
        </style>
    </head>
    <body>
        <div class="create-card">
            <h3 class="text-center mb-4">Sign in veille</h3>
            <div id="alertBox" class="alert alert-danger d-none"></div>
            <form id="create-form">
                <div class="mb-3">
                <label for="compte" class="form-label">Compte</label>
                <input type="text" class="form-control" id="compte" required>
                </div>
                <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="user_type" class="form-label">Type d'utilisateur</label>
                    <select id="typeSelector" class="form-select me-3" style="width: 250px;">
                        <option value="veilleur">Veilleur</option>
                        <option value="analyste">Analyste</option>
                        <option value="decideur">Decideur</option>
                    </select>
                </div>
                <button class="btn btn-primary w-100">Creer</button>
            </form>
        </div>
        <script src="../static/js/create_user.js"></script>
    </body>
</html>
