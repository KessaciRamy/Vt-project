<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Décideur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Dashboard Décideur</span>
            
            <div class="d-flex align-items-center">
                <select id="dbSelector" class="form-select me-3" style="width: 250px;">
                    <option value="" disabled selected>Chargement...</option>
                </select>

                <div class="dropdown me-3">
                    <button class="btn btn-outline-light position-relative" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bell-fill"></i>
                        <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                            0
                        </span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="notifDropdown" id="notifList" style="width: 320px; max-height: 400px; overflow-y: auto;">
                        <li><span class="dropdown-item-text text-muted">Chargement...</span></li>
                    </ul>
                </div>

                <button class="btn btn-outline-light btn-sm" onclick="logout()">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h2 id="dbTitle">Vue d'ensemble</h2>
                        <p class="text-muted">Sélectionnez une technologie ci-dessus.</p>
                        <div class="row text-center" id="kpiRow"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Sévérité des Vulnérabilités</div>
                    <div class="card-body">
                        <canvas id="cveChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Dernières Versions</div>
                    <ul class="list-group list-group-flush" id="releaseList" style="max-height: 300px; overflow-y: auto;">
                        <li class="list-group-item text-muted">Aucune donnée</li>
                    </ul>
                </div>
            </div>
             <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header">Mots-clés / Tendances</div>
                    <div class="card-body">
                        <canvas id="keywordChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
