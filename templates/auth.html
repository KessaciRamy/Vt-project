<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - App Veille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Connexion Veille</h3>
    <div id="alertBox" class="alert alert-danger d-none"></div>
    
    <form id="loginForm">
        <div class="mb-3">
            <label for="compte" class="form-label">Compte</label>
            <input type="text" class="form-control" id="compte" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
    <button onclick="window.location.replace('/account')" class="btn btn-primary w-100 mt-3">Creer un nouveau compte</button>
</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
